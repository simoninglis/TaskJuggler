<!DOCTYPE html>
<html>
<head>
    <title>Test Data Loading</title>
</head>
<body>
    <h1>Test Data Loading</h1>
    <div id="result"></div>
    
    <script>
        // Test fetching the data file
        const resultDiv = document.getElementById('result');
        
        fetch('src/data/sample-gantt.json')
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            })
            .then(data => {
                resultDiv.innerHTML = `
                    <h2>✅ Data loaded successfully!</h2>
                    <p><strong>Project:</strong> ${data.project}</p>
                    <p><strong>Tasks:</strong> ${data.tasks.length}</p>
                    <p><strong>Start:</strong> ${data.start}</p>
                    <p><strong>End:</strong> ${data.end}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <h2>❌ Error loading data</h2>
                    <p>${error.message}</p>
                `;
            });
    </script>
</body>
</html>
