[pytest]
# Pytest configuration for TaskJuggler Web UI tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    -p no:warnings

# Custom markers
markers =
    smoke: Quick smoke tests for critical functionality
    regression: Comprehensive regression tests
    slow: Tests that take more than 5 seconds
    flaky: Tests that may fail intermittently (use sparingly)

# Timeout for tests (in seconds)
timeout = 60

# Test order
# Run smoke tests first, then regression, then everything else
testpaths = 
    tests/smoke
    tests/regression
    tests/command_palette
    tests/keyboard
    tests/integration
    tests/components