<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskJuggler - Interactive Gantt Chart</title>
    
    <!-- DHTMLX Gantt CSS -->
    <link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css" type="text/css">
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="css/main.css" type="text/css">
    <link rel="stylesheet" href="css/dark-theme.css" type="text/css">
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 id="projectTitle">TaskJuggler</h1>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>
    
    <div class="gantt-container">
        <div id="gantt_here" tabindex="0"></div>
    </div>
    
    <div class="status">
        <h3>Status</h3>
        <div id="status">Ready. Loading sample TaskJuggler data...</div>
        <div id="activeFilters" style="margin-top: 10px; padding: 8px; background: #e3f2fd; border-radius: 4px; display: none;">
            <strong style="color: #1976d2;">Active Filter:</strong>
            <span id="filterDescription"></span>
            <button onclick="clearAllFilters()" style="margin-left: 10px; padding: 4px 8px; background: #fff; border: 1px solid #1976d2; border-radius: 4px; color: #1976d2; cursor: pointer;">Clear Filter</button>
        </div>
        <div style="margin-top: 10px; font-size: 12px; color: #666;">
            Press <kbd style="padding: 2px 6px; background: #f8f9fa; border: 1px solid #ccc; border-radius: 3px;">?</kbd> for keyboard shortcuts
        </div>
    </div>

    <!-- Custom command palette container (created dynamically by custom-command-palette.js) -->
    
    <!-- DHTMLX Gantt JS -->
    <script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
    
    <!-- Modular JavaScript files -->
    <script src="js/theme-manager.js"></script>
    <script src="js/gantt-config.js"></script>
    <script src="js/gantt-data.js"></script>
    <script src="js/gantt-controls.js"></script>
    <script src="js/keyboard-manager.js"></script>
    <script src="js/keyboard-help.js"></script>
    <script src="js/custom-command-palette.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
