<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskJuggler - Interactive Gantt Chart</title>
    
    <!-- DHTMLX Gantt CSS -->
    <link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css" type="text/css">
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="css/main.css" type="text/css">
    <link rel="stylesheet" href="css/dark-theme.css" type="text/css">
    <link rel="stylesheet" href="css/responsive-layout.css" type="text/css">
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 id="projectTitle">TaskJuggler</h1>
            <theme-manager></theme-manager>
        </div>
    </div>
    
    <div class="main-content">
        <div class="gantt-container">
            <div id="gantt_here" tabindex="0"></div>
        </div>
        
        <div class="status" id="statusSection">
            <div class="status-header" onclick="toggleStatus()">
                <h3>Status</h3>
                <button class="status-toggle" aria-label="Toggle status section">▼</button>
            </div>
            <div class="status-content">
                <div id="status">Ready. Loading sample TaskJuggler data...</div>
                <div id="activeFilters" style="margin-top: 10px; padding: 8px; background: var(--status-info-bg); border-radius: 4px; display: none;">
                    <strong style="color: var(--status-info-text);">Active Filter:</strong>
                    <span id="filterDescription"></span>
                    <button onclick="clearAllFilters()" style="margin-left: 10px; padding: 4px 8px; background: var(--bg-secondary); border: 1px solid var(--status-info-text); border-radius: 4px; color: var(--status-info-text); cursor: pointer;">Clear Filter</button>
                </div>
                <div style="margin-top: 10px; font-size: 12px; color: var(--text-tertiary);">
                    Press <kbd style="padding: 2px 6px; background: var(--bg-tertiary); border: 1px solid var(--border-secondary); border-radius: 3px;">?</kbd> for keyboard shortcuts
                </div>
            </div>
        </div>
    </div>

    <!-- Custom command palette container (created dynamically by custom-command-palette.js) -->
    
    <!-- Web Components -->
    <keyboard-help></keyboard-help>
    <layout-manager></layout-manager>
    
    <!-- DHTMLX Gantt JS -->
    <script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
    
    <!-- Main entry point for Vite -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
